name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-safety:
    name: Repository safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Block audio, data, env files, keys and dumps
        run: bash scripts/check-forbidden-files.sh
      - name: Scan for secrets (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 \
            git /repo --redact --verbose

  backend:
    name: Backend
    # Pinned so the FFmpeg the tests run against is the one the worker uses (6.1, Ubuntu 24.04).
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: lokdhara
          POSTGRES_PASSWORD: lokdhara
          POSTGRES_DB: lokdhara
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lokdhara -d lokdhara"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      LKD_ENV: test
      LKD_TEST_DATABASE_URL: postgresql+psycopg://lokdhara:lokdhara@localhost:5432/lokdhara
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type-check
        run: uv run mypy app tests
      - name: Test
        run: uv run pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Bundle size budget
        run: npm run size

  browser:
    name: Browser test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: lokdhara
          POSTGRES_PASSWORD: lokdhara
          POSTGRES_DB: lokdhara
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lokdhara -d lokdhara"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      LKD_ENV: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --locked
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Contributor and report flows (synthetic data, fake microphone)
        working-directory: frontend
        run: npm run e2e
      - name: Keep the report when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
